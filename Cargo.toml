[package]
name = "ytlocal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37"
egui_extras = { version = "0.37.0", features = ["image"] }
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "json"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time", "fs"] }
tokio-util = "0.7.20"
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
